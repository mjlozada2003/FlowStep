services:
  db:
    image: postgres:15-alpine
    container_name: flowstep_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flowstep_db
      TZ: America/La_Paz
      PGTZ: America/La_Paz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
